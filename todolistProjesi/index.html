<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="css/bootstrap.min.css" />
    <link rel="stylesheet" href="css/style.css" />
    <title>ToDoList Projesi</title>
  </head>

  <body>
    <div class="container mt-5">
      <header>
        <h1 class="text-center mb-4 text-white">ToDoList</h1>
        <form class="d-flex align-items-center position-relative araForm mb-4">
          <input
            type="text"
            name="ara"
            class="form-control araInput"
            placeholder="Ara..."
          />
          <i class="fa-solid fa-magnifying-glass araIcon"></i>
        </form>
      </header>

      <ul class="list-group listeUl">
        <li
          class="list-group-item d-flex justify-content-between align-items-center liGroup"
        >
          <span>Spora git</span>
          <i class="fa-solid fa-trash-can cursorPointer delete"></i>
        </li>

        <li
          class="list-group-item d-flex justify-content-between align-items-center liGroup"
        >
          <span>Ders çalış</span>
          <i class="fa-solid fa-trash-can cursorPointer delete"></i>
        </li>

        <li
          class="list-group-item d-flex justify-content-between align-items-center liGroup"
        >
          <span>Alışveriş yap</span>
          <i class="fa-solid fa-trash-can cursorPointer delete"></i>
        </li>
      </ul>

      <form class="d-flex justify-content-between align-items-center gorevClass mt-4">
        <input
          type="text"
          class="form-control gorevInput me-3"
          placeholder="Yeni görev ekle..."
        />
        <button type="submit" class="btn ekleBtn">Ekle</button>
      </form> 
    </div>

    <script
      src="https://kit.fontawesome.com/a4909f3383.js"
      crossorigin="anonymous"
    ></script>
    <script src="js/script.js"></script>
    <script src="js/bootstrap.bundle.min.js"></script>
  </body>
</html>
